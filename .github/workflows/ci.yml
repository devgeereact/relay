name: CI

# Nothing ran on push before this existed. Relay is software someone runs live,
# once a week, in front of a congregation, with no second take — so the bar is
# that main is always shippable, and that the specific defects we've already been
# bitten by can never quietly come back.
#
# The Rust job runs on BOTH macOS and Windows deliberately. Windows is a day-one
# platform (docs/DECISIONS.md) and the STT model-path bug — which left speech
# recognition silently dead on every packaged Windows build — was invisible on a
# Mac. A single-OS matrix would not have caught it, and would not catch the next
# one either.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave GITHUB_TOKEN on disk for the rest of the job.
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # whisper-rs compiles whisper.cpp from source and needs CMake.
      - name: Install CMake
        uses: lukka/get-cmake@latest

      # Tauri's Linux deps aren't needed (we build macOS + Windows only), but the
      # frontend must exist: channels.rs `include_dir!`s ../dist at compile time,
      # so the Rust build FAILS without a built frontend. Not optional.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --all-targets

      # Detection benchmark. Already gated by `cargo test` above — these tests
      # FAIL the build if the wrong-verse rate exceeds the SPEC target, if a
      # paraphrase ever auto-fires, or if recall drops. This step just prints the
      # scorecard so a regression is readable in the log rather than merely red.
      - name: Detection scorecard
        if: matrix.os == 'macos-latest'
        working-directory: src-tauri
        run: cargo test eval::tests::print_scorecard -- --nocapture

      # The release profile is a DIFFERENT build from `cargo test`, and it was
      # broken: whisper.cpp needs std::filesystem (macOS 10.15+) while Tauri's
      # default deployment target is 10.13, so `tauri build` had never once
      # succeeded — Relay could not be packaged at all. That is also why the
      # Windows-only STT model-path bug survived: nobody could produce a bundle
      # to find it in. `tauri dev` does not catch this. This step does.
      # COMPILE-ONLY, deliberately. `--no-bundle` builds the release binary but
      # does NOT produce or exercise the msi/dmg installers. The compile is the
      # part that was broken (whisper.cpp needs std::filesystem, and Tauri's
      # release profile was passing a 10.13 deployment target), and it needs no
      # signing identity to prove. Installer/layout coverage is a separate job we
      # don't have yet — don't read this step as "packaging works".
      # `--features metal` MUST match what release.yml ships. The matrix above is
      # [macos-latest, windows-latest], so this step is the macOS one.
      #
      # Without it here, a tag would be the first time Metal was ever compiled —
      # which is precisely the shape of every release trap already recorded in
      # CLAUDE.md (§19-23): a build path that only runs when it is far too late to
      # find out it is broken. Metal doubles the whisper.cpp compile surface, so it
      # gets compiled on every push, like everything else that can break a release.
      - name: Release build (compile only, no installer)
        if: matrix.os != 'windows-latest'
        env:
          # MUST match release.yml. whisper.cpp needs std::filesystem (macOS 10.15+)
          # and Tauri's release profile otherwise passes 10.13, which is why
          # `tauri build` never once succeeded before it was fixed. A CI job that
          # compiles against a different deployment target than the one shipped is
          # not testing the build that ships — the exact failure mode this whole
          # step exists to catch.
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: npm run tauri build -- --no-bundle --features metal

      # WINDOWS GETS THE FULL BUNDLE, every push.
      #
      # Windows is a day-one platform that nobody on this project can run, and the
      # .msi is the artifact a church actually installs — and it had NEVER ONCE BEEN
      # BUILT. It was produced for the first time only when a release tag was pushed,
      # which is the worst possible moment to discover that WiX is unhappy.
      #
      # Every Windows-specific bug in this repo's history has had the same shape: it
      # compiled, every test passed, and the failure only existed in a bundle nobody
      # made. So we make the bundle.
      #
      # macOS stays compile-only: the DMG bundling is proven, and `bundle_dmg.sh`
      # drives Finder over AppleScript (see docs/RELEASING.md), which is a poor thing
      # to put on the critical path of every push.
      - name: Release build + INSTALLER (Windows — the thing churches install)
        if: matrix.os == 'windows-latest'
        run: npm run tauri build

      - name: Upload the Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: relay-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # THE NODE MATRIX IS NOT DECORATION — DO NOT TRIM IT TO ONE.
  #
  # `npm test` passed on Node 20, which is all CI ran, and failed on Node 22 and
  # newer with 60 red tests on a clean checkout: `TypeError: Cannot read properties
  # of undefined (reading 'clear')` on the first `localStorage.clear()`.
  #
  # Node >= 22 defines `localStorage`/`sessionStorage` on the global as OWN accessor
  # properties which return `undefined` without `--localstorage-file`, and vitest's
  # jsdom environment leaves keys the global already owns — so Node's dead stub won
  # over jsdom's real Storage. The 60 tests are exactly the ones covering what an
  # operator sees when the app relaunches: the session, the crash record, the
  # first-run flag.
  #
  # `src/test-setup.js` fixes it, and CLAUDE.md says in as many words: "Don't delete
  # it because 'jsdom provides that'." **Nothing in CI exercised that fix.** Deleting
  # the shim would have left this workflow green while every contributor on a current
  # Node saw a broken checkout — the shape of a guard that guards nothing.
  #
  # 20 is the floor the Rust job also uses; 22 is where the break was; 24 is a
  # current runtime, so the fix is proved forward and not only backward.
  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave GITHUB_TOKEN on disk for the rest of the job.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Relay's version lives in three files (tauri.conf.json, package.json,
      # Cargo.toml). tauri.conf.json's copy is what the updater manifest advertises,
      # and Tauri decides whether an update exists by comparing it as semver against
      # what the church is running. If they drift, the release stamps the wrong number
      # and every install silently decides it is already up to date. Catch it on the
      # PR that causes it, not on the tag that ships it.
      - name: Version files agree
        run: npm run version:check
      - run: npm run build
      # Includes the IPC contract test, which checks every Tauri command the
      # frontend calls by string actually exists in Rust. Renaming a
      # #[tauri::command] otherwise fails silently inside a `catch {}` — a button
      # just quietly stops working, and you find out during a service.
      - run: npm test
