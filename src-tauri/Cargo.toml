[package]
name = "relay"
version = "0.2.0-1"
description = "AI-assisted live presentation software for churches"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The fire → nav → clear path — the one that actually puts scripture in front of a
# congregation — lived entirely in main.rs, which had ZERO tests and no integration
# test anywhere. It was verified only by a human driving the app by hand.
#
# `tauri/test` gives a headless mock app with real managed state, so the real commands
# can be driven against a real (in-memory) database and the events they emit asserted.
# It is a dev-dependency: nothing here ships.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# `test-util` is NOT part of tokio's `full`. It gives tests a controllable clock, so
# a five-second server timeout can be asserted without a test that takes five
# seconds — a test slow enough to be skipped is a test that stops being run.
# Dev-only: nothing in the shipped binary changes.
tokio = { version = "1", features = ["full", "test-util"] }

# GPU acceleration for whisper is a BUILD-TIME fact, not a runtime one: whisper.cpp
# is compiled with a backend or it is not. These forward to whisper-rs so
# `sysprobe` can report what this binary was actually built with, instead of
# guessing from the hardware.
#
# ── macOS gets Metal automatically, and this is the single biggest latency fix
#    in the product. MEASURED on an M4 Pro, one decode of the 8s rolling window:
#
#      ggml-large-v3-turbo   CPU   ~1710 ms      Metal   ~602 ms    (2.8x)
#      ggml-small            CPU    ~423 ms      Metal   ~153 ms
#      ggml-base             CPU    ~146 ms      Metal    ~59 ms
#
#    Each figure is the median of repeated runs; a first-ever build measures far
#    slower on cold caches and must not be quoted.
#
#    The worker re-decodes that window every step of new voice against a ~1000ms
#    budget, so 1710ms can never keep up: the backlog grows, the drain jumps the
#    audio position, and the operator watches the transcript arrive after the
#    sentence. 602ms fits, with room to spare.
#    That was a DEFAULT, not a choice anyone made — `default = []` shipped CPU-only
#    builds to every Mac while the Hardware Check screen honestly reported it.
#
#    Window length is NOT the lever, and measuring said so: 8s and 4s cost the same
#    because whisper pads the mel window internally. Do not
#    "optimise" WINDOW_SECS — it is also coupled to `router::DEFAULT_DEBOUNCE_MS`.
#
# Windows/Linux keep the CPU default: `vulkan` and `cuda` need a runtime the box may
# not have, and a build that fails to start is worse than one that is slow. Ship
# those explicitly (`--features vulkan`) once there is a machine to verify them on.
[features]
default = []
metal = ["whisper-rs/metal"]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
coreml = ["whisper-rs/coreml"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"          # Phase 10 — WS sink/stream for kiosk clients
cpal = "0.15"                 # Phase 3 — cross-platform audio capture (Win + macOS)
whisper-rs = "0.14"           # Phase 4 — local speech-to-text (whisper.cpp bindings; needs cmake to build)
nnnoiseless = { version = "0.5", default-features = false } # Phase C — offline RNNoise speech denoiser (pure Rust, bundled model, no build deps)
include_dir = "0.7"           # Embed the built frontend (dist/) to serve output/stage pages over LAN HTTP in production
zip = { version = "2", default-features = false, features = ["deflate"] } # Import — .proplaylist is a ZIP of .pro presentations
base64 = "0.22"               # Import — receive the picked file's bytes from the webview (FileReader → base64)
# Crash reporting. OPT-IN and OFF by default — see telemetry.rs. Deliberately no
# default features: no `contexts`/`panic` auto-magic we haven't read, and above
# all no HTTP transport we didn't choose. Nothing is sent unless the operator
# turns it on, and content (transcripts, verse text, lyrics) is never sent at all.
sentry = { version = "0.48", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
# In-app STT model download. rustls (not native-tls) so there is no OpenSSL build
# dependency on Windows. `stream` gives us progress + resumable downloads; a
# 148 MB fetch on a church's connection WILL be interrupted.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"                 # verify the model we downloaded is the model we meant
# Fold tone marks and dots-below so "Jòhánù" and "Johanu" are the same token.
# Whisper emits both, depending on the audio — see detection::normalize.
unicode-normalization = "0.1"
# Auto-update. Without this there is no way to deliver a fix to a church that has
# already installed Relay — and this is software that fails LIVE, in front of a
# congregation. Updates are signed; see docs/RELEASING.md.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"   # relaunch after an update is installed
# Hardware Check (Launch & Startup). Memory and disk headroom cannot be read from
# std on both Windows and macOS without per-platform FFI. Minimal features: the
# system and disk readers only — no processes, no networks, no components. Relay
# reads totals and free space; it does not enumerate what else is running.
#
# **>= 0.39 IS A CORRECTNESS FLOOR, NOT A PREFERENCE.** On 0.32,
# `System::available_memory()` returns **0 on macOS** — silently, with no error.
# The Hardware Check screen would have read "0.0 GB free of 25.8 GB — close other
# apps before the service" on a completely healthy laptop, every single boot.
# `free_memory()` is not a substitute: macOS excludes cached and inactive pages,
# so it reported 674 MB on the same machine that had 12.3 GB genuinely available.
# Caught by `sysprobe::tests::print_hardware`, which is exactly why that test
# exists. Do not relax this bound without re-running it on macOS.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
rust-stemmers = "1.2.0"

# THE DISPLAY'S REAL NAME, on macOS.
#
# tao (Tauri's windowing layer) reports a macOS monitor as
# `format!("Monitor #{}", CGDisplay::model_number())` — a raw EDID model number,
# so the operator picking which screen the congregation sees was offered
# "Monitor #1234555" instead of "HP-532sf". Choosing the wrong entry there sends
# the verse to the wrong screen, so the name has to be the one macOS itself shows
# in System Settings › Displays.
#
# That name is `NSScreen.localizedName` (10.15+), which needs AppKit; matching it
# back to a Tauri monitor needs `CGDisplayBounds`. Both crates are already in the
# dependency tree via Tauri — these entries only make them directly callable, and
# only on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
# Metal, unconditionally on macOS — see the measured numbers above [features].
whisper-rs = { version = "0.14", features = ["metal"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSScreen"] }
objc2-foundation = { version = "0.3", features = ["NSValue", "NSString", "NSDictionary"] }
core-graphics = "0.25"

# Added in later build phases — uncomment as each phase lands (see PROMPT.md):
# ndi-sdk-sys or equivalent  # Phase 10 — NDI render target (evaluate available crates, may need custom FFI bindings)

[[bin]]
name = "relay"
path = "src/main.rs"
